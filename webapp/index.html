<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>TaskPinger</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>TaskPinger</div>
      <div class="clock" id="clock"></div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="day" class="active"><span class="ti">🗓</span><span>День</span></button>
      <button data-tab="tasks"><span class="ti">📋</span><span>Завдання</span></button>
      <button data-tab="habits"><span class="ti">🔁</span><span>Звички</span></button>
      <button data-tab="stats"><span class="ti">📊</span><span>Статистика</span></button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <script src="assets/app.js?v=2"></script>
</body>
</html>
